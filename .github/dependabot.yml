version: 2
updates:
  - package-ecosystem: pip
    directory: /requirements/ha-candidate
    target-branch: devel
    allow:
      - dependency-name: homeassistant
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 1
    commit-message:
      prefix: "build(ha-proposal)"
    labels:
      - dependencies
      - ha-version-proposal
  - package-ecosystem: pip
    directory: /
    target-branch: devel
    versioning-strategy: increase-if-necessary
    ignore:
      # Keep every generated HA test-stack pin aligned with its selected release.
      - dependency-name: "aioesphomeapi"
      - dependency-name: "aiousbwatcher"
      - dependency-name: "bleak"
      - dependency-name: "bleak-esphome"
      - dependency-name: "bleak-retry-connector"
      - dependency-name: "bluetooth-adapters"
      - dependency-name: "bluetooth-auto-recovery"
      - dependency-name: "bluetooth-data-tools"
      - dependency-name: "dbus-fast"
      - dependency-name: "esphome-dashboard-api"
      - dependency-name: "habluetooth"
      - dependency-name: "homeassistant"
      - dependency-name: "pytest-homeassistant-custom-component"
      - dependency-name: "serialx"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      test-tooling:
        patterns:
          - pytest*
          - coverage*
          - ruff
          - mypy
          - pylint
          - types-*
    labels:
      - dependencies
      - python
  - package-ecosystem: github-actions
    directory: /
    target-branch: devel
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
