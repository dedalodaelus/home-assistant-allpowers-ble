name: Sandbox temporary quality verification (#224)

on:
  push:
    branches:
      - sandbox

permissions:
  contents: read

jobs:
  quality:
    name: Ruff, Mypy, Pylint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sandbox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: python -m pip install --requirement requirements_test.txt
      - name: Ruff format
        id: ruff_format
        continue-on-error: true
        run: ruff format --check custom_components scripts tests
      - name: Ruff lint
        id: ruff_check
        continue-on-error: true
        run: ruff check custom_components scripts tests
      - name: Mypy
        id: mypy
        continue-on-error: true
        run: mypy custom_components/allpowers_ble
      - name: Pylint errors
        id: pylint
        continue-on-error: true
        run: pylint --errors-only custom_components/allpowers_ble
      - name: Enforce all checks
        if: always()
        run: |
          echo 'Ruff format: ${{ steps.ruff_format.outcome }}'
          echo 'Ruff lint: ${{ steps.ruff_check.outcome }}'
          echo 'Mypy: ${{ steps.mypy.outcome }}'
          echo 'Pylint: ${{ steps.pylint.outcome }}'
          test '${{ steps.ruff_format.outcome }}' = 'success'
          test '${{ steps.ruff_check.outcome }}' = 'success'
          test '${{ steps.mypy.outcome }}' = 'success'
          test '${{ steps.pylint.outcome }}' = 'success'
