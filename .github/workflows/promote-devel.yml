name: Promote devel to main

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: promote-devel-to-main
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out promotion template and script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare draft promotion PR
        id: promotion
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTION_TEMPLATE: .github/PULL_REQUEST_TEMPLATE/promotion.md
        run: python3 -m scripts.promote_devel

      - name: Summarize result
        if: steps.promotion.outputs['pull-request-url'] != ''
        env:
          PR_URL: ${{ steps.promotion.outputs['pull-request-url'] }}
        run: echo "Draft promotion PR: ${PR_URL}" >> "$GITHUB_STEP_SUMMARY"
