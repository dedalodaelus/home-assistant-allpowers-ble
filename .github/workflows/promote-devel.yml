name: Promote devel to main

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: promote-devel-to-main
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the promotion template and orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Create narrowly scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PROMOTION_APP_ID }}
          private-key: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Check branches and prepare promotion PR
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROMOTION_TOKEN: ${{ steps.app-token.outputs.token }}
          PROMOTION_TEMPLATE: .github/PULL_REQUEST_TEMPLATE/promotion.md
        run: python3 -m scripts.promote_devel
