# Centralized PR gate: enforces branch policy + required checks in one workflow.
name: Merge gate

on:
  # Trigger on PR lifecycle events where policy/check status can change.
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

# Minimum privileges for reading PR/check state.
permissions: {}

concurrency:
  # Keep one active run per PR and cancel obsolete runs after new pushes.
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    # Single required job that aggregates policy checks and CI check conclusions.
    name: Gate all required checks
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      checks: read
      pull-requests: read
    env:
      REQUIRE_HIL_STABLE_GATE: ${{ vars.REQUIRE_HIL_STABLE_GATE || 'false' }}
    steps:
      - name: Check out trusted base and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Run the validator from the trusted base revision, not PR-controlled code.
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the immutable PR head revision
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin \
            "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/promotion-validation-head"
          test "$(git rev-parse refs/remotes/origin/promotion-validation-head)" = "$PR_HEAD_SHA"

      - name: Validate release metadata at current PR revisions
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: >-
          python3 -m scripts.promotion_metadata
          --base-sha "$PR_BASE_SHA"
          --head-sha "$PR_HEAD_SHA"
          --base-ref "$PR_BASE_REF"
          --head-ref "$PR_HEAD_REF"

      - name: Wait for required checks on PR head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Resolve repository/PR context from the event payload.
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;

            // Hard stop: this workflow is only meaningful for pull_request events.
            if (!pr) {
              core.setFailed("This workflow only supports pull_request events.");
              return;
            }

            // Capture refs + author data used by branch and bot-policy checks.
            const baseRef = pr.base?.ref || "";
            const headRef = pr.head?.ref || "";
            const headSha = pr.head.sha;
            const prAuthorLogin = pr.user?.login || "";
            const prAuthorType = pr.user?.type || "";
            const isHotfixBranch = /^hotfix\//.test(headRef);
            const isReleasePleaseBranch = /^release-please--/.test(headRef);
            const releasePleaseAllowedBots = new Set([
              "github-actions[bot]",
              "release-please[bot]",
            ]);
            const isReleasePleaseBotAuthor =
              prAuthorType === "Bot" && releasePleaseAllowedBots.has(prAuthorLogin);

            // Policy: PRs to main are only allowed from devel, hotfix/*, or release-please branches.
            if (
              baseRef === "main"
              && headRef !== "devel"
              && !isHotfixBranch
              && !isReleasePleaseBranch
            ) {
              core.setFailed(
                `PRs targeting main must come from 'devel', 'hotfix/*', or 'release-please--*'. Current source: '${headRef}'.`
              );
              return;
            }

            // Policy: release-please PRs to main must be opened by an approved bot account.
            if (baseRef === "main" && isReleasePleaseBranch && !isReleasePleaseBotAuthor) {
              core.setFailed(
                `PRs from 'release-please--*' to main must be authored by an approved bot. Current author: '${prAuthorLogin}' (${prAuthorType || "unknown"}).`
              );
              return;
            }

            // Policy: hotfix branches targeting main must be based on main.
            // A valid hotfix head must be equal to or ahead of main in commit ancestry.
            if (baseRef === "main" && isHotfixBranch) {
              // Compare main against the hotfix head SHA to confirm ancestry direction.
              const mainVsHotfix = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: "main",
                head: headSha,
              });

              if (
                mainVsHotfix.data.status !== "ahead"
                && mainVsHotfix.data.status !== "identical"
              ) {
                core.setFailed(
                  `Hotfix branch '${headRef}' must be based on 'main'. Create hotfix branches from 'main'.`
                );
                return;
              }
            }

            // Policy: CHANGELOG.md is managed by release-please and must not be edited
            // in regular development PRs.
            // Exception: allow main -> devel sync PRs to carry changelog updates.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const changedPaths = new Set(
              files.flatMap((file) => [file.filename, file.previous_filename].filter(Boolean))
            );
            const touchesChangelog = changedPaths.has("CHANGELOG.md");
            const isFeatureToDevel = baseRef === "devel";
            const isPromotionToMain = baseRef === "main";
            const isMainToDevelSync = baseRef === "devel" && headRef === "main";

            if (
              touchesChangelog
              && (
                (isFeatureToDevel && !isMainToDevelSync)
                || (isPromotionToMain && !isReleasePleaseBranch)
              )
            ) {
              core.setFailed(
                "CHANGELOG.md is managed by release-please and cannot be modified in PRs to devel or main."
              );
              return;
            }

            // Draft PRs skip strict gate until marked ready for review.
            if (pr.draft) {
              core.info("Draft PR detected. Skipping strict gate until ready for review.");
              return;
            }

            // Required check names must match GitHub check-run names exactly.
            const requiredChecks = [
              "Python, tests, and release validation",
              "HACS validation",
              "Home Assistant Hassfest",
              "Validate title",
              "Review dependency changes",
              "Analyze Python",
            ];
            const requireHilStableGate =
              String(process.env.REQUIRE_HIL_STABLE_GATE || "").toLowerCase() === "true";
            if (baseRef === "main" && requireHilStableGate) {
              requiredChecks.push("HIL qualification (opt-in)");
              core.info("REQUIRE_HIL_STABLE_GATE=true; enforcing HIL qualification check.");
            }
            // Accepted terminal conclusions for required checks.
            const acceptedConclusions = new Set(["success", "neutral", "skipped"]);

            // Polling/timing controls for check-run discovery and completion.
            const pollIntervalMs = 15000;
            const timeoutMs = 30 * 60 * 1000;
            const missingChecksGraceMs = 10 * 60 * 1000;
            const start = Date.now();

            // Keep only the latest run per check name (re-runs may create duplicates).
            function formatRunsMap(checkRuns) {
              const map = new Map();
              for (const run of checkRuns) {
                const previous = map.get(run.name);
                if (!previous || new Date(run.started_at) > new Date(previous.started_at)) {
                  map.set(run.name, run);
                }
              }
              return map;
            }

            // Poll until all required checks are completed/accepted, or fail fast on policy.
            while (true) {
              const elapsed = Date.now() - start;
              if (elapsed > timeoutMs) {
                core.setFailed("Timeout waiting for required checks to complete.");
                return;
              }

              // Pull latest check-runs for the exact PR head commit.
              const response = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: headSha,
                per_page: 100,
              });

              const checkRuns = response.data.check_runs || [];
              const latestByName = formatRunsMap(checkRuns);

              const missing = [];
              const pending = [];
              const failed = [];

              // Classify each required check as missing, pending, or failed.
              for (const checkName of requiredChecks) {
                const run = latestByName.get(checkName);
                if (!run) {
                  missing.push(checkName);
                  continue;
                }

                if (run.status !== "completed") {
                  pending.push(`${checkName} (${run.status})`);
                  continue;
                }

                if (!acceptedConclusions.has(run.conclusion || "")) {
                  failed.push(`${checkName} (${run.conclusion || "unknown"})`);
                }
              }

              // Diagnostic logging to simplify gate troubleshooting in Actions UI.
              core.info(`Head SHA: ${headSha}`);
              if (missing.length) core.info(`Missing: ${missing.join(", ")}`);
              if (pending.length) core.info(`Pending: ${pending.join(", ")}`);
              if (failed.length) core.info(`Failed: ${failed.join(", ")}`);

              // Any terminal non-accepted conclusion fails the gate immediately.
              if (failed.length) {
                core.setFailed(`Required checks failed: ${failed.join("; ")}`);
                return;
              }

              // Fail early with actionable context when expected checks do not appear.
              if (missing.length && elapsed >= missingChecksGraceMs) {
                const discoveredChecks = [...latestByName.keys()].sort();
                core.setFailed(
                  `Missing required checks after ${Math.floor(missingChecksGraceMs / 60000)} minutes: `
                  + `${missing.join(", ")}. Discovered checks: ${discoveredChecks.join(", ") || "none"}. `
                  + "If checks were renamed, update requiredChecks in .github/workflows/merge-gate.yml."
                );
                return;
              }

              // Success condition: no missing checks and no pending runs.
              if (missing.length === 0 && pending.length === 0) {
                // Fail closed if either immutable revision moved while required
                // checks were running. A fresh PR event must validate the new pair.
                const latestPull = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pr.number,
                });
                if (
                  latestPull.data.head.sha !== headSha
                  || latestPull.data.base.sha !== pr.base.sha
                ) {
                  core.setFailed(
                    "PR base or head changed while checks were running. Wait for validation of the current revisions before merging."
                  );
                  return;
                }
                core.info("All required checks completed successfully.");
                return;
              }

              // Continue polling while checks are still being created/executed.
              await new Promise((resolve) => setTimeout(resolve, pollIntervalMs));
            }
