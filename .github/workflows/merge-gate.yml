# Centralized PR gate: enforces branch policy + required checks in one workflow.
name: Merge gate

on:
  # Trigger on PR lifecycle events where policy/check status can change.
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

# Minimum privileges for reading PR/check state.
permissions: {}

concurrency:
  # Keep one active run per PR and cancel obsolete runs after new pushes.
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    # Single required job that aggregates policy checks and CI check conclusions.
    name: Gate all required checks
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      checks: read
      pull-requests: read
    env:
      REQUIRE_HIL_STABLE_GATE: ${{ vars.REQUIRE_HIL_STABLE_GATE || 'false' }}
    steps:
      - name: Validate edited PR title
        if: github.event.action == 'edited' && github.event.changes.title != null
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            test

      - name: Wait for required checks on PR head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Resolve repository/PR context from the event payload.
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;

            // Hard stop: this workflow is only meaningful for pull_request events.
            if (!pr) {
              core.setFailed("This workflow only supports pull_request events.");
              return;
            }

            // Capture refs + author data used by branch and bot-policy checks.
            const baseRef = pr.base?.ref || "";
            const headRef = pr.head?.ref || "";
            const headSha = pr.head.sha;
            const titleWasEdited = Object.hasOwn(context.payload.changes || {}, "title");
            const prAuthorLogin = pr.user?.login || "";
            const prAuthorType = pr.user?.type || "";
            const isHotfixBranch = /^hotfix\//.test(headRef);
            const isReleasePleaseBranch = /^release-please--/.test(headRef);
            const releasePleaseAllowedBots = new Set([
              "github-actions[bot]",
              "release-please[bot]",
            ]);
            const isReleasePleaseBotAuthor =
              prAuthorType === "Bot" && releasePleaseAllowedBots.has(prAuthorLogin);

            // Policy: PRs to main are only allowed from devel, hotfix/*, or release-please branches.
            if (
              baseRef === "main"
              && headRef !== "devel"
              && !isHotfixBranch
              && !isReleasePleaseBranch
            ) {
              core.setFailed(
                `PRs targeting main must come from 'devel', 'hotfix/*', or 'release-please--*'. Current source: '${headRef}'.`
              );
              return;
            }

            // Policy: release-please PRs to main must be opened by an approved bot account.
            if (baseRef === "main" && isReleasePleaseBranch && !isReleasePleaseBotAuthor) {
              core.setFailed(
                `PRs from 'release-please--*' to main must be authored by an approved bot. Current author: '${prAuthorLogin}' (${prAuthorType || "unknown"}).`
              );
              return;
            }

            // Policy: hotfix branches targeting main must be based on main.
            // A valid hotfix head must be equal to or ahead of main in commit ancestry.
            if (baseRef === "main" && isHotfixBranch) {
              // Compare main against the hotfix head SHA to confirm ancestry direction.
              const mainVsHotfix = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: "main",
                head: headSha,
              });

              if (
                mainVsHotfix.data.status !== "ahead"
                && mainVsHotfix.data.status !== "identical"
              ) {
                core.setFailed(
                  `Hotfix branch '${headRef}' must be based on 'main'. Create hotfix branches from 'main'.`
                );
                return;
              }
            }

            // Policy: CHANGELOG.md is managed by release-please and must not be edited
            // in regular development PRs.
            // Exception: allow main -> devel sync PRs to carry changelog updates.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const touchesChangelog = files.some((file) => file.filename === "CHANGELOG.md");
            const isFeatureToDevel = baseRef === "devel";
            const isPromotionToMain = baseRef === "main";
            const isMainToDevelSync = baseRef === "devel" && headRef === "main";

            if (
              touchesChangelog
              && (
                (isFeatureToDevel && !isMainToDevelSync)
                || (isPromotionToMain && !isReleasePleaseBranch)
              )
            ) {
              core.setFailed(
                "CHANGELOG.md is managed by release-please and cannot be modified in PRs to devel or main."
              );
              return;
            }

            // Recheck release metadata against this PR event's immutable revisions.
            // This remains on the existing pull_request gate and applies to drafts too.
            if (baseRef === "main" && headRef === "devel") {
              const changedPaths = new Set();
              for (const file of files) {
                changedPaths.add(file.filename);
                if (file.previous_filename) changedPaths.add(file.previous_filename);
              }
              const protectedPaths = ["CHANGELOG.md", ".release-please-manifest.json"];
              const changedProtected = protectedPaths.filter((path) => changedPaths.has(path));
              if (changedProtected.length) {
                core.setFailed(`Promotion changes Release Please managed files: ${changedProtected.join(", ")}.`);
                return;
              }

              const readJsonAt = async (path, ref) => {
                const response = await github.rest.repos.getContent({ owner, repo, path, ref });
                if (Array.isArray(response.data) || response.data.type !== "file") {
                  throw new Error(`Expected a file at ${path} for ${ref}.`);
                }
                return JSON.parse(Buffer.from(response.data.content, "base64").toString("utf8"));
              };
              const parseVersion = (value) => {
                const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.exec(value);
                if (!match) throw new Error(`Invalid SemVer: ${value}`);
                return [Number(match[1]), Number(match[2]), Number(match[3]), match[4]];
              };
              const compareVersion = (left, right) => {
                const a = parseVersion(left);
                const b = parseVersion(right);
                for (let i = 0; i < 3; i += 1) if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1;
                if (a[3] === b[3]) return 0;
                if (a[3] === undefined) return 1;
                if (b[3] === undefined) return -1;
                const ai = a[3].split(".");
                const bi = b[3].split(".");
                for (let i = 0; i < Math.max(ai.length, bi.length); i += 1) {
                  if (ai[i] === undefined) return -1;
                  if (bi[i] === undefined) return 1;
                  if (ai[i] === bi[i]) continue;
                  const an = /^[0-9]+$/.test(ai[i]);
                  const bn = /^[0-9]+$/.test(bi[i]);
                  if (an && bn) return Number(ai[i]) < Number(bi[i]) ? -1 : 1;
                  if (an !== bn) return an ? -1 : 1;
                  return ai[i] < bi[i] ? -1 : 1;
                }
                return 0;
              };
              try {
                const [baseIntegration, headIntegration, baseRelease, headRelease] = await Promise.all([
                  readJsonAt("custom_components/allpowers_ble/manifest.json", pr.base.sha),
                  readJsonAt("custom_components/allpowers_ble/manifest.json", headSha),
                  readJsonAt(".release-please-manifest.json", pr.base.sha),
                  readJsonAt(".release-please-manifest.json", headSha),
                ]);
                const baseVersion = baseIntegration.version;
                const headVersion = headIntegration.version;
                if (typeof baseVersion !== "string" || typeof headVersion !== "string") {
                  throw new Error("Integration manifests must contain string versions.");
                }
                if (compareVersion(headVersion, baseVersion) < 0) {
                  throw new Error(`Integration version regressed from ${baseVersion} to ${headVersion}.`);
                }
                if (headVersion !== baseVersion) {
                  throw new Error("Promotion must preserve the integration version; use Release Please or a reviewed synchronization PR.");
                }
                if (
                  typeof baseRelease !== "object"
                  || typeof headRelease !== "object"
                  || baseRelease === null
                  || headRelease === null
                  || Array.isArray(baseRelease)
                  || Array.isArray(headRelease)
                ) {
                  throw new Error("Release Please manifests must contain version objects.");
                }
                for (const [name, version] of Object.entries(baseRelease)) {
                  if (!(name in headRelease)) throw new Error(`Release Please history was removed for ${name}.`);
                  if (typeof version !== "string" || typeof headRelease[name] !== "string") {
                    throw new Error("Release Please manifest versions must be strings.");
                  }
                  if (compareVersion(headRelease[name], version) < 0) {
                    throw new Error(`Release Please version regressed for ${name}.`);
                  }
                }
                for (const version of Object.values(headRelease)) {
                  if (typeof version !== "string") throw new Error("Release Please manifest versions must be strings.");
                  parseVersion(version);
                }
              } catch (error) {
                core.setFailed(`Promotion metadata validation failed: ${error.message}`);
                return;
              }
              const current = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
              if (current.data.base.sha !== pr.base.sha || current.data.head.sha !== headSha) {
                core.setFailed("Promotion refs moved during metadata validation; rerun the merge gate.");
                return;
              }
            }

            // Draft PRs skip strict gate until marked ready for review.
            if (pr.draft) {
              core.info("Draft PR detected. Skipping strict gate until ready for review.");
              return;
            }

            // Required check names must match GitHub check-run names exactly.
            const requiredChecks = [
              "Python, tests, and release validation",
              "HACS validation",
              "Home Assistant Hassfest",
              "Validate title",
              "Review dependency changes",
              "Analyze Python",
            ];
            const requireHilStableGate =
              String(process.env.REQUIRE_HIL_STABLE_GATE || "").toLowerCase() === "true";
            if (baseRef === "main" && requireHilStableGate) {
              requiredChecks.push("HIL qualification (opt-in)");
              core.info("REQUIRE_HIL_STABLE_GATE=true; enforcing HIL qualification check.");
            }
            // Accepted terminal conclusions for required checks.
            const acceptedConclusions = new Set(["success", "neutral", "skipped"]);

            // Polling/timing controls for check-run discovery and completion.
            const pollIntervalMs = 15000;
            const timeoutMs = 30 * 60 * 1000;
            const missingChecksGraceMs = 10 * 60 * 1000;
            const start = Date.now();

            function latestRunsByName(checkRuns) {
              const latest = new Map();
              for (const run of checkRuns) {
                const previous = latest.get(run.name);
                if (!previous || Number(run.id) > Number(previous.id)) latest.set(run.name, run);
              }
              return latest;
            }

            // Poll until all required checks are completed/accepted, or fail fast on policy.
            while (true) {
              const elapsed = Date.now() - start;
              if (elapsed > timeoutMs) {
                core.setFailed("Timeout waiting for required checks to complete.");
                return;
              }

              // Pull latest check-runs for the exact PR head commit.
              const response = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: headSha,
                per_page: 100,
              });

              const checkRuns = response.data.check_runs || [];
              const latestByName = latestRunsByName(checkRuns);

              const missing = [];
              const pending = [];
              const failed = [];

              // Classify each required check as missing, pending, or failed.
              for (const checkName of requiredChecks) {
                // The pinned action above validates edited titles. An old check on
                // this unchanged head SHA cannot prove which title it evaluated.
                if (checkName === "Validate title" && titleWasEdited) continue;

                const run = latestByName.get(checkName);
                if (!run) {
                  missing.push(checkName);
                  continue;
                }

                if (run.status !== "completed") {
                  pending.push(`${checkName} (${run.status})`);
                  continue;
                }

                if (!acceptedConclusions.has(run.conclusion || "")) {
                  failed.push(`${checkName} (${run.conclusion || "unknown"})`);
                }
              }

              // Diagnostic logging to simplify gate troubleshooting in Actions UI.
              core.info(`Head SHA: ${headSha}`);
              if (missing.length) core.info(`Missing: ${missing.join(", ")}`);
              if (pending.length) core.info(`Pending: ${pending.join(", ")}`);
              if (failed.length) core.info(`Failed: ${failed.join(", ")}`);

              // Any terminal non-accepted conclusion fails the gate immediately.
              if (failed.length) {
                core.setFailed(`Required checks failed: ${failed.join("; ")}`);
                return;
              }

              // Fail early with actionable context when expected checks do not appear.
              if (missing.length && elapsed >= missingChecksGraceMs) {
                const discoveredChecks = [...latestByName.keys()].sort();
                core.setFailed(
                  `Missing required checks after ${Math.floor(missingChecksGraceMs / 60000)} minutes: `
                  + `${missing.join(", ")}. Discovered checks: ${discoveredChecks.join(", ") || "none"}. `
                  + "If checks were renamed, update requiredChecks in .github/workflows/merge-gate.yml."
                );
                return;
              }

              // Success condition: no missing checks and no pending runs.
              if (missing.length === 0 && pending.length === 0) {
                // Metadata can change while checks are running. Do not accept a gate
                // decision made for an obsolete title/base/head event payload.
                const current = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
                if (
                  current.data.title !== pr.title
                  || current.data.base.ref !== baseRef
                  || current.data.head.sha !== headSha
                ) {
                  core.setFailed("PR title, base, or head changed while required checks were being validated; rerun the merge gate.");
                  return;
                }
                core.info("All required checks completed successfully.");
                return;
              }

              // Continue polling while checks are still being created/executed.
              await new Promise((resolve) => setTimeout(resolve, pollIntervalMs));
            }
