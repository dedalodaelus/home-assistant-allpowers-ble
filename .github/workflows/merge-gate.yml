# Centralized PR gate: enforces branch policy + required checks in one workflow.
name: Merge gate

on:
  # Trigger on PR lifecycle events where policy/check status can change.
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

# Minimum privileges for reading PR/check state.
permissions: {}

concurrency:
  # Keep one active run per PR and cancel obsolete runs after new pushes.
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    # Single required job that aggregates policy checks and CI check conclusions.
    name: Gate all required checks
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      checks: read
      pull-requests: read
      actions: read
    env:
      REQUIRE_HIL_STABLE_GATE: ${{ vars.REQUIRE_HIL_STABLE_GATE || 'false' }}
    steps:
      - name: Validate edited PR title
        if: github.event.action == 'edited' && github.event.changes.title != null
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            test

      # The PR merge revision contains the tested Python gate module. This
      # workflow has read-only repository permissions and no other secrets.
      - name: Check out pull request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Wait for required checks on PR head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.merge_gate
