name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python, tests, and release validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements_test.txt

      # Pre-commit contains autofix hooks and must finish before readers start.
      - name: Pre-commit hooks
        run: pre-commit run --all-files

      # GitHub waits for every step in this group before continuing.
      # Keep this group at or below GitHub's ten-step parallel limit.
      - parallel:
          - name: Ruff format
            run: ruff format --check custom_components scripts tests

          - name: Ruff lint
            run: ruff check custom_components scripts tests

          - name: Mypy
            run: mypy custom_components/allpowers_ble

          - name: Pylint errors
            run: pylint --errors-only custom_components/allpowers_ble

          - name: Unit and simulated transport tests
            env:
              COVERAGE_FILE: .coverage.unit
              USE_REAL_HOMEASSISTANT: "0"
            run: >-
              pytest --ignore=tests/homeassistant
              --basetemp=.pytest-tmp-unit
              -o cache_dir=.pytest_cache-unit
              --cov=custom_components/allpowers_ble
              --cov-branch
              --cov-report=term-missing
              --cov-report=xml:coverage.xml

          - name: Config flow coverage gate
            env:
              COVERAGE_FILE: .coverage.config-flow
              USE_REAL_HOMEASSISTANT: "0"
            run: >-
              pytest tests/test_config_flow.py
              --basetemp=.pytest-tmp-config-flow
              -o cache_dir=.pytest_cache-config-flow
              --cov=custom_components.allpowers_ble.config_flow
              --cov-branch
              --cov-report=term-missing
              --cov-report=xml:coverage-config-flow.xml
              --cov-fail-under=100

          - name: Real Home Assistant lifecycle harness
            env:
              USE_REAL_HOMEASSISTANT: "1"
            run: >-
              pytest tests/homeassistant
              --basetemp=.pytest-tmp-homeassistant
              -o cache_dir=.pytest_cache-homeassistant

          - name: Validate repository
            run: python scripts/validate_repository.py

          - name: Validate HIL qualification matrix
            run: python scripts/validate_hil_qualification.py

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Remove generated caches
        run: make clean

      - name: Build HACS release archive
        run: python scripts/build_release.py --clean

      - name: Release metadata dry-run (non-publishing)
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = Path("custom_components/allpowers_ble/manifest.json")
          print(json.loads(manifest.read_text(encoding="utf-8"))["version"])
          PY
          )"
          python scripts/validate_release_metadata.py \
            --tag "${VERSION}" \
            --zip-path dist/allpowers_ble.zip \
            --checksum-path dist/allpowers_ble.zip.sha256 \
            --write-checksum \
            --verify-checksum

      - name: Validate archive layout
        run: python scripts/validate_repository.py

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: allpowers_ble-${{ github.sha }}
          path: |
            dist/allpowers_ble.zip
            dist/allpowers_ble.zip.sha256
          if-no-files-found: error
          retention-days: 14
