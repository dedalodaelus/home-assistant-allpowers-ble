name: Hassfest

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "37 4 * * 1"

permissions: {}

jobs:
  validate:
    name: Home Assistant Hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master
