name: Hassfest

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

jobs:
  validate:
    name: Home Assistant Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
