name: Hassfest

run-name: evidence w=hassfest j=validate pr=${{ github.event.pull_request.number }} r=${{ github.repository }} b=${{ github.event.pull_request.base.sha }} h=${{ github.event.pull_request.head.sha }} s=${{ github.sha }} a=${{ github.run_attempt }}

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "37 4 * * 1"

permissions: {}

jobs:
  validate:
    name: Home Assistant Hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: home-assistant/actions/hassfest@07f46fd2e19967768b5fd3000f91f857452b767c # master
