name: Dependency review

run-name: evidence w=dependencies j=review pr=${{ github.event.pull_request.number }} r=${{ github.repository }} b=${{ github.event.pull_request.base.sha }} h=${{ github.event.pull_request.head.sha }} s=${{ github.sha }}

on:
  pull_request:

permissions: {}

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
