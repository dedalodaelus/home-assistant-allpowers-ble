name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Prepare semantic release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          include-v-in-tag: false

      - name: Check out released revision
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Set up Python
        if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Validate release version
        if: steps.release.outputs.release_created == 'true'
        run: python scripts/check_version.py "${{ steps.release.outputs.tag_name }}"

      - name: Build HACS asset
        if: steps.release.outputs.release_created == 'true'
        run: python scripts/build_release.py --clean

      - name: Validate release metadata and checksum
        if: steps.release.outputs.release_created == 'true'
        run: >-
          python scripts/validate_release_metadata.py
          --tag "${{ steps.release.outputs.tag_name }}"
          --zip-path dist/allpowers_ble.zip
          --checksum-path dist/allpowers_ble.zip.sha256
          --write-checksum
          --verify-checksum

      - name: Upload HACS asset
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${{ steps.release.outputs.tag_name }}"
          dist/allpowers_ble.zip
          dist/allpowers_ble.zip.sha256
          --clobber
