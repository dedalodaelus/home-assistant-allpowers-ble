name: HIL qualification

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      require_pass:
        description: "Require reviewed scoped passes for every firmware, route, scenario, and capability"
        type: boolean
        required: false
        default: false
      max_age_days:
        description: "Maximum evidence age in days when require_pass is true"
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: hil-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: HIL qualification (opt-in)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Validate HIL evidence and matrix
        env:
          HIL_REQUIRE_PASS: ${{ inputs.require_pass }}
          HIL_MAX_AGE_DAYS: ${{ inputs.max_age_days }}
        run: |
          set -euo pipefail
          ARGS=(scripts/validate_hil_qualification.py)

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "$HIL_REQUIRE_PASS" == "true" ]]; then
              ARGS+=(--require-pass)
              if [[ -n "$HIL_MAX_AGE_DAYS" ]]; then
                if ! [[ "$HIL_MAX_AGE_DAYS" =~ ^[0-9]+$ ]]; then
                  echo "max_age_days must be a non-negative integer" >&2
                  exit 2
                fi
                ARGS+=(--max-age-days "$HIL_MAX_AGE_DAYS")
              fi
            fi
          elif [[ "${{ vars.REQUIRE_HIL_STABLE_GATE }}" == "true" ]]; then
            ARGS+=(--require-pass)
          fi

          python "${ARGS[@]}"
