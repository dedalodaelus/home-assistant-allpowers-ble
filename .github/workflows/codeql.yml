name: CodeQL

run-name: evidence w=codeql j=analyze pr=${{ github.event.pull_request.number }} r=${{ github.repository }} b=${{ github.event.pull_request.base.sha }} h=${{ github.event.pull_request.head.sha }} s=${{ github.sha }} a=${{ github.run_attempt }}

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "13 3 * * 3"

permissions: {}

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@38112626f97ac1fd7acf3df7ebca51f4677c1b38 # v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@38112626f97ac1fd7acf3df7ebca51f4677c1b38 # v4
        with:
          category: /language:python
