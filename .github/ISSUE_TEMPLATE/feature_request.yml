name: Feature request
description: Propose a Home Assistant feature that does not assume a new protocol is safe.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem rather than only the preferred implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: protocol
    attributes:
      label: Does this require new BLE commands or writable bits?
      options:
        - No
        - Yes, read-only protocol change
        - Yes, write/control change
        - Unknown
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Protocol or hardware evidence
      description: Required for write/control changes. Remove identifying data.
    validations:
      required: false
