name: Model compatibility report
description: Report validation results for another ALLPOWERS model or revision.
title: "compat: "
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: >-
        A matching name or UUID is not enough to establish safe compatibility.
        This project uses internal Bronze/Silver/Gold/Platinum hardware support
        tiers, separate from Home Assistant's Integration Quality Scale and from
        production write authorization. Report only what you observed. Test
        without critical loads; optional HIL CLI ZIPs may be attached after
        reviewing the public export for privacy. See docs/hil-cli.md for the
        guided workflow.
  - type: input
    id: model
    attributes:
      label: Exact product model and hardware revision (or unknown)
      description: Enter "unknown" if the hardware revision cannot be determined.
    validations:
      required: true
  - type: input
    id: advertised_name
    attributes:
      label: Advertised Bluetooth name
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version or explicitly unknown
      description: State the observed firmware version, or enter "unknown".
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Observed BLE route
      description: If you tested both routes, submit a separate report for each. Do not select mixed.
      options:
        - Unknown
        - Local adapter
        - Active proxy
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Home Assistant, integration, ESPHome, and proxy/adapter versions
    validations:
      required: true
  - type: checkboxes
    id: results
    attributes:
      label: Observed feature coverage (select only verified observations)
      options:
        - label: Device was discovered.
        - label: Active config-flow probe succeeded.
        - label: Fresh telemetry was plausible.
        - label: AC output is physically present.
        - label: AC output is confirmed physically absent.
        - label: AC on/off was safely tested and physically confirmed.
        - label: DC output is physically present.
        - label: DC output is confirmed physically absent.
        - label: DC on/off was safely tested and physically confirmed.
        - label: Light is physically present.
        - label: Light is confirmed physically absent.
        - label: Light on/off was safely tested and physically confirmed.
        - label: Declared settings/functions were safely tested and restored.
        - label: Basic reconnect/recovery was observed.
        - label: A continuous 24-hour read-only soak was completed.
  - type: dropdown
    id: support_tier
    attributes:
      label: Evidence status (do not infer a tier from selections)
      options:
        - Unknown / not evaluated
        - Unqualified
        - Bronze candidate
        - Silver candidate
        - Gold candidate
        - Platinum candidate
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Per-feature status (present / absent / unknown / untested) and evidence limits
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional sanitized evidence summary or reviewed HIL CLI ZIP link
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and safety
      options:
        - label: >-
            I removed addresses, serial numbers, credentials, timestamps revealing
            occupancy, and personal data.
          required: true
        - label: I did not test experimental writes with a critical load attached.
          required: true
        - label: >-
            If I performed candidate/experimental writes, I stayed present and was prepared
            to restore the device manually.
          required: true
