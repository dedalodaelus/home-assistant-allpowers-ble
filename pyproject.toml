[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "homeassistant: tests that import the real Home Assistant runtime",
]

[tool.coverage.run]
branch = true
source = ["custom_components/allpowers_ble"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
fail_under = 98
precision = 1
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 88
src = ["custom_components", "scripts", "tests"]
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "B",
  "F",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.allpowers_ble", "tests"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]
"tests/*" = ["B018", "DTZ005", "S101"]

[tool.mypy]
python_version = "3.14"
follow_imports = "normal"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_no_return = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
files = ["custom_components/allpowers_ble"]
exclude = ["tests", "scripts"]

[[tool.mypy.overrides]]
module = ["bleak", "bleak.*", "bleak_retry_connector", "bleak_retry_connector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "homeassistant",
  "homeassistant.*",
  "voluptuous",
  "voluptuous.*",
]
ignore_missing_imports = true

[tool.pylint.main]
py-version = "3.14"
ignore-paths = ["tests", "scripts"]
jobs = 0
load-plugins = []

[tool.pylint.format]
max-line-length = 88

[tool.pylint.messages_control]
disable = [
  "duplicate-code",
  "fixme",
  "import-outside-toplevel",
  "no-member",
  "too-few-public-methods",
]

[tool.pylint.design]
max-args = 10
max-attributes = 40
max-locals = 25
max-public-methods = 30
max-returns = 8
max-statements = 80
